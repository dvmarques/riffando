# Temporário para atualizar o lockfile da GC-013 em ambiente npm com rede.
# Não usa segredos nem permissões de escrita e será removido após aplicar o delta.
name: GC-013 - regenerar lock Expo (temporário)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  lock-delta:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - run: npm install --global npm@12.2.1
      - name: Atualizar patches de produção na matriz SDK 58
        run: npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund expo@58.0.21 expo-constants@58.0.14 expo-dev-client@58.0.17 expo-linking@58.0.15 expo-router@58.0.28
      - name: Atualizar preset de testes da mesma matriz
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact --no-audit --no-fund jest-expo@58.0.13
      - name: Exportar somente delta JSON do lockfile (sem secrets)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const prev = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
          const now = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const oldPaths = prev.packages;
          const updated = Object.fromEntries(Object.entries(now.packages).filter(([key, value]) =>
            JSON.stringify(oldPaths[key]) !== JSON.stringify(value)
          ));
          const deleted = Object.keys(oldPaths).filter(key => !(key in now.packages));
          const delta = JSON.stringify({ updated, deleted, packageJson: JSON.parse(readFileSync('package.json', 'utf8')) });
          console.log('RIFFANDO_DELTA_START');
          for (let index = 0; index < delta.length; index += 2400) {
            console.log('RIFFANDO_DELTA:' + delta.slice(index, index + 2400));
          }
          console.log('RIFFANDO_DELTA_END');
          console.log('Atualizadas ' + Object.keys(updated).length + ' entradas; removidas ' + deleted.length);
          NODE
