name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENSPEC_TELEMETRY: '0'
  OPENSPEC_NO_UPDATE_CHECK: '1'
  EXPO_NO_TELEMETRY: '1'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  scope:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Classificação do CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - id: classify
        run: node scripts/ci-scope.mjs

  documentation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Documentação e OpenSpec (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run validate:docs
      - run: node --test tests/tooling/ci-scope.test.mjs tests/tooling/gate.test.mjs tests/tooling/ci-workflow.test.mjs

  javascript:
    needs: scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.scope == 'full'
    name: Qualidade e exportação Android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run check:env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:foundation-tooling
      - run: npm run test:ci
      - run: npm run check:expo
      - run: npm run export:android
      - uses: actions/upload-artifact@v7
        with:
          name: javascript-reports
          path: |
            coverage/
            dist/android/metadata.json
          retention-days: 7
          if-no-files-found: error

  windows:
    needs: scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.scope == 'full'
    name: Instalação e scripts Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run check:env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:foundation-tooling
      - run: npm run test:ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
      - name: Instalar SDK pela CLI Android fixada
        run: '& "$env:ANDROID_HOME/cmdline-tools/16111833/bin/android.exe" "--sdk=$env:ANDROID_HOME" sdk install platforms/android-37.0 build-tools/37.0.0 ndk/27.1.12297006 cmake/3.31.6'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - run: npm exec -- expo prebuild --platform android --no-install
      - name: Habilitar caminhos longos no runner Windows
        run: New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force
      - run: npm run check:env:gradle
      - run: npm run build:android
      - uses: actions/upload-artifact@v7
        with:
          name: android-validation-windows
          path: artifacts/riffando-validation.apk
          if-no-files-found: error
          retention-days: 7

  android:
    needs: scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.scope == 'full'
    name: APK Android nativo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@12.2.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - run: npm ci --ignore-scripts
      - run: npm run build:android
      - name: Testar agregação de PCM em Kotlin (JVM)
        run: |
          cd android
          ./gradlew :riffando-audio:testDebugUnitTest
          node ../scripts/verify-pcm-junit.mjs
      - run: node scripts/probe-android-compilation.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: android-validation
          path: |
            artifacts/riffando-validation.apk
            artifacts/compilation-probe.log
          if-no-files-found: error
          retention-days: 7

  emulator:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.scope == 'full'
    name: Smoke Android offline
    needs: [scope, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@v8
        with:
          name: android-validation
          path: artifacts
      - name: Permitir aceleração KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: node scripts/smoke-android.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke-evidence
          path: artifacts/smoke
          retention-days: 7
          if-no-files-found: error

  gate:
    name: Fundação — gate agregado
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [scope, documentation, javascript, windows, android, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - run: node scripts/ci-gate.mjs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
