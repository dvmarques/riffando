schema: spec-driven

context: |
  Riffando: aprendizado e prática de guitarra em pt-BR. GitHub é a fonte da verdade.
  Políticas de trabalho e gates de aprovação: AGENTS.md.
  Tutorial de comandos, sem políticas adicionais: docs/development/AI_WORKFLOW.md.
  Ler docs/PROJECT_CONTEXT.md, docs/DECISIONS.md, docs/product/PRD.md,
  docs/product/ROADMAP.md, docs/architecture/ARCHITECTURE.md
  e docs/architecture/DATA_MODEL.md.
  React Native + Expo + TypeScript; Android primeiro, possibilidade de iOS.
  Offline-first, dados locais, sem backend/login/IA generativa obrigatórios.
  App não implementado; ferramentas não autorizam as 41 tarefas GC.
  Monorepo e motor C++ são propostas, não decisões de implementação.
  PolyForm Noncommercial 1.0.0; preservar licença, marca e direitos de terceiros.
  Artefatos em pt-BR; marcadores estruturais e MUST/SHALL em inglês.
  Restrições de Explore, arquitetura, merge, squash e archive: seguir AGENTS.md.

rules:
  proposal:
    - Referenciar issue GitHub e GC quando aplicável; declarar motivação, escopo, fora do escopo e critérios de aceite.
    - Separar decisões aprovadas de hipóteses; registrar aprovação necessária e impactos em docs existentes.
    - Manutenção sem alteração de capacidade pode declarar skip_specs nos metadados como true com justificativa; não criar deltas funcionais fictícios.
  specs:
    - Descrever comportamento observável, com Requirement, MUST ou SHALL e ao menos um Scenario com WHEN e THEN.
    - Incluir offline, privacidade, pt-BR, acessibilidade e erros quando afetados; não inventar capacidades já entregues.
  design:
    - Explicar alternativas e fronteiras UI, domínio, persistência e áudio; justificar dependências e licenças.
    - Para áudio, registrar aparelho, entrada microfone/USB, timestamps, latência e validação nativa necessária.
  tasks:
    - Criar incrementos pequenos e verificáveis com testes, revisão de código, documentação e CI.
    - Executar npm run validate; adicionar lint, tipos, testes e build mobile reais quando houver código.
    - Incluir somente entregas verificáveis que possam ser concluídas antes do archive; registrar autorização, archive, merge e fechamento administrativo no checklist da PR, sem dependência circular em tasks.md.
    - Não marcar tarefas incompletas como feitas; se uma entrega real depender de integração prévia, mantê-la aberta e documentar a exceção em design e PR conforme AGENTS.md.

operations:
  apply:
    guidance:
      - Ler AGENTS.md e a issue; confirmar aprovação e implementar somente o escopo autorizado.
      - Atualizar tarefas com evidências; não iniciar backlog funcional durante preparação de ferramentas.
  archive:
    guidance:
      - Exigir todas as tarefas concluídas, revisão, CI e autorização aplicável; no fluxo padrão, arquivar e sincronizar na própria branch da PR antes do merge por squash.
      - Revisar e validar archive e specs sincronizadas; exigir CI verde no commit final antes do squash. Seguir AGENTS.md para gates e autorizações.
      - Somente restrição concreta documentada e aprovada permite integração prévia em main/develop; nesse caso, concluir tarefas dependentes depois da integração e arquivar em PR de acompanhamento, sempre com merge por squash.
